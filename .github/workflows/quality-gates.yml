name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ORCH-001 placeholder quality gate
        run: python3 orchestrator/scripts/run_quality_gate.py
